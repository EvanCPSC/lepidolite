<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lepidolite</title>
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="scripts.js" defer></script>
    </head>

    <body>

        <div class="header">
            <img src="assets/logo.png" alt="Lepidolite Logo" class="logo">
            <h1>Create Event</h1>
            <button class="close-button" onclick="closeLepidEvent()">
                <span class="material-symbols-outlined close-icon">
                    close
                </span>
            </button>
        </div>
        <hr class="header-divider">

        <div class ="create-event">
            <form id="create-form">
                <label>Event Name:</label>
                <input type="text" id="event-name" name="event-name" required>

                <label>Event Date:</label>
                <input type="date" id="event-date" name="event-date" required>

                <label>Event Time:</label>
                <input type="time" id="event-time" name="event-time">

                <label>Event Description:</label>
                <input type="text" id="event-description" name="event-description">

                <button type="submit">Create Event</button>
            </form>

        </div>

    </body>
    
</html>
