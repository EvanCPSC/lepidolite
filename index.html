<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lepidolite</title>
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="scripts.js" defer></script>
    </head>

    <body>

        <div class="header">
            <img src="assets/logo.png" alt="Lepidolite Logo" class="logo">
            <div class="month-selector">
                <div class="month-buttons">
                    <button class="month-button-left">
                        <span class="material-symbols-outlined left-arrow">
                            arrow_back_2
                        </span>
                    </button>
                    <button class="month-button-right">
                        <span class="material-symbols-outlined right-arrow">
                            play_arrow
                        </span>
                    </button>
                </div>
                <p id="month">September</p>
            </div>
            <div class="right-buttons">
                <button class="list-button" onclick="switchView(true)">
                    <span class="material-symbols-outlined list-icon">
                        list
                    </span>
                </button>
                <button class="add-button" onclick="createLepidEvent()">
                    <span class="material-symbols-outlined add-icon">
                        add
                    </span>
                </button>
            </div>
        </div>
        <hr class="header-divider">
        <table class="calendar">
            <tr>
                <td><p></p></td>
                <td><p></p></td>
                <td><p>1</p></td>
                <td><p>2</p></td>
                <td><p>3</p></td>
                <td><p>4</p></td>
                <td><p>5</p></td>
            </tr>
            <tr>
                <td><p>6</p></td>
                <td><p>7</p></td>
                <td><p>8</p></td>
                <td><p>9</p><div onclick="editLepidEvent(null)">edit event</div></td>
                <td><p>10</p></td>
                <td><p>11</p></td>
                <td><p>12</p></td>
            </tr>
            <tr>
                <td><p>13</p></td>
                <td><p>14</p></td>
                <td><p>15</p></td>
                <td><p>16</p></td>
                <td><p>17</p></td>
                <td><p>18</p></td>
                <td><p>19</p></td>
            </tr>
            <tr>
                <td><p>20</p></td>
                <td><p>21</p></td>
                <td><p>22</p></td>
                <td><p>23</p></td>
                <td><p>24</p></td>
                <td><p>25</p></td>
                <td><p>26</p></td>
            </tr>
            <tr>
                <td><p>27</p></td>
                <td><p>28</p></td>
                <td><p>29</p></td>
                <td><p>30</p></td>
                <td><p></p></td>
                <td><p></p></td>
                <td><p></p></td>
        </table>

    </body>
    
</html>
