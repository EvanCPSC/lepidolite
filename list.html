<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lepidolite</title>
        <link rel="icon" href="assets/favicon.png" type="image/png">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script src="scripts.js" defer></script>
    </head>

    <body>

        <div class="header">
            <img src="assets/logo.png" alt="Lepidolite Logo" class="logo">
            <div class="month-selector">
                <div class="month-buttons">
                    <button class="month-button-left">
                        <span class="material-symbols-outlined left-arrow">
                            arrow_back_2
                        </span>
                    </button>
                    <button class="month-button-right">
                        <span class="material-symbols-outlined right-arrow">
                            play_arrow
                        </span>
                    </button>
                </div>
                <p id="month">September</p>
            </div>
            <div class="right-buttons">
                <button class="calendar-button" onclick="switchView(false)">
                    <span class="material-symbols-outlined calendar-icon">
                        calendar_today
                    </span>
                </button>
                <button class="add-button" onclick="createLepidEvent()">
                    <span class="material-symbols-outlined add-icon">
                        add
                    </span>
                </button>
            </div>
        </div>
        <hr class="header-divider">
        <div class="list-event" onclick="editLepidEvent(null)">
            <p>edit event</p>
            <p>September 9, 2026</p>
        </div>

    </body>
    
</html>
